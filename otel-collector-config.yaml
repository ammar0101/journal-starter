receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  awsxray:
    region: us-east-1
  awsemf:
    region: us-east-1
    namespace: JournalAPI
    log_group_name: /journal-api/metrics
  awscloudwatchlogs:
    region: us-east-1
    log_group_name: /journal-api/logs
    log_stream_name: app

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsemf]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [awscloudwatchlogs]