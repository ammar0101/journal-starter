apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: journal-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      serviceAccountName: journal-api
      containers:
        - name: journal-api
          image: 098567766079.dkr.ecr.us-east-1.amazonaws.com/journal-api:runtime-secrets-dbhost-20261024
          ports:
            - containerPort: 8000
          env:
            - name: APP_CONFIG_SECRET_ARN
              value: journal-api/runtime
            - name: AWS_REGION
              value: us-east-1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /version
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /version
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: journal-api
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: journal-api
spec:
  selector:
    app: journal-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP