apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-production
  namespace: default
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: journal-api
  namespace: default
  annotations:
    cert-manager.io/issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - journal-api.example.invalid
      secretName: journal-api-tls
  rules:
    - host: journal-api.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: journal-api
                port:
                  number: 80
